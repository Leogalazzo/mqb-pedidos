<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="estilos.css">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#084788">
<link rel="icon" type="image/png" sizes="192x192" href="/192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/512.png">
<link rel="apple-touch-icon" href="/192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MQB Pedidos">
</head>
<body class="pantalla-login flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <img src="https://imagedelivery.net/ut8GNCA1obOu4JnXrJ_J9Q/e7b59903-06e0-48f8-1bb1-71bd6da8a800/public" alt="MQB" class="h-16 w-auto mx-auto">
      <div class="text-sm mt-1" style="color:var(--tinta-suave)">Sistema de pedidos entre sucursales</div>
    </div>

    <form id="form-login" class="tarjeta-login p-6 sm:p-7 space-y-5">
      <div>
        <label class="block text-xs font-600 mb-1.5" style="color:var(--tinta-suave)">Usuario</label>
        <div class="campo-con-icono">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input id="usuario" type="text" required autocomplete="username"
            autocapitalize="none" autocorrect="off" spellcheck="false"
            class="w-full border rounded px-3 py-2.5 outline-none"
            style="border-color:var(--linea)">
        </div>
      </div>
      <div>
        <label class="block text-xs font-600 mb-1.5" style="color:var(--tinta-suave)">Contraseña</label>
        <div class="campo-con-icono campo-clave">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <rect x="4" y="10" width="16" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input id="password" type="password" required autocomplete="current-password"
            class="w-full border rounded px-3 py-2.5 outline-none"
            style="border-color:var(--linea)">
          <button type="button" id="btn-ver-clave" class="btn-ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icono-ojo icono-ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="icono-ojo icono-ojo-cerrado hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <p id="error" class="text-sm hidden" style="color:var(--rojo)"></p>
      <button type="submit"
        class="w-full py-2.5 rounded font-600 text-white transition"
        style="background:var(--ambar-oscuro)">
        Ingresar
      </button>
    </form>

    <p class="text-xs text-center mt-6" style="color:var(--tinta-suave)">
     Ingresá con el usuario y la contraseña que te dieron.
    </p>
  </div>

<script type="module">
import { auth, onAuthStateChanged, signInWithEmailAndPassword, obtenerRolPorCorreo, emailDesdeUsuario }
  from "./firebase-config.js";
import { conCarga } from "./ui.js";

const form = document.getElementById("form-login");
const btnIngresar = form.querySelector('button[type="submit"]');
const errorEl = document.getElementById("error");

// Mostrar/ocultar la contraseña tocando el ojo.
const inputPassword = document.getElementById("password");
const btnVerClave = document.getElementById("btn-ver-clave");
btnVerClave.addEventListener("click", () => {
  const visible = inputPassword.type === "text";
  inputPassword.type = visible ? "password" : "text";
  btnVerClave.setAttribute("aria-pressed", String(!visible));
  btnVerClave.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
  btnVerClave.querySelector(".icono-ojo-abierto").classList.toggle("hidden", !visible);
  btnVerClave.querySelector(".icono-ojo-cerrado").classList.toggle("hidden", visible);
});

function mostrarError(msg){
  errorEl.textContent = msg;
  errorEl.classList.remove("hidden");
}

function redirigirSegunRol(user){
  const rol = obtenerRolPorCorreo(user.email);
  if (rol === "central") {
    location.href = "central.html";
  } else if (rol === "panadero") {
    location.href = "panaderia.html";
  } else {
    location.href = "sucursal.html";
  }
}

// Si ya hay sesión iniciada, saltar directo a su pantalla.
onAuthStateChanged(auth, (user) => {
  if (user) redirigirSegunRol(user);
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  errorEl.classList.add("hidden");
  const email = emailDesdeUsuario(document.getElementById("usuario").value);
  const password = document.getElementById("password").value;
  conCarga(btnIngresar, async () => {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    redirigirSegunRol(cred.user);
  }, "Ingresando…", false).catch(() => {
    mostrarError("Usuario o contraseña incorrectos.");
  });
});
</script>
<script>
// Registra el service worker para que la app sea instalable (ícono propio,
// se abre sin barra del navegador) y abra un instante aunque no haya señal.
// Si falla (por ejemplo, mirando el sitio en un entorno sin HTTPS), no pasa
// nada: la app funciona igual, solo sin esta parte.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
